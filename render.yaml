services:
  - type: web
    name: industrial-code-demo-v8
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: LLM_API_BASE
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_CODE_MAX_TOKENS
        value: "6000"
      - key: LLM_DISABLE_THINKING
        value: "true"
      - key: ALLOW_FALLBACK
        value: "true"
      - key: JOB_TIMEOUT_SECONDS
        value: "240"
